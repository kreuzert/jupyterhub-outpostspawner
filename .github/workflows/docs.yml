name: Documentation

# Builds the Zensical documentation and deploys it to GitHub Pages.
#
# Note: this repo is mirrored from GitLab, so the workflow is committed here
# and pushed to the GitHub mirror. The push then triggers the build on GitHub.
# The GitHub repo's Pages source must be set to "GitHub Actions" (Settings >
# Pages > Build and deployment > Source).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time, but don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
